[auth]
site_url = "https://dritchwear.com"
additional_redirect_urls = [
  "https://dritchwear.com/auth/confirm-email",
  "https://dritchwear.com/auth/reset-password",
  "http://localhost:8081",
  "dritchwear://auth/callback",
  "dritchwear://--/auth/callback",
  "dritchwear://callback",
  "https://dritchwear.com",
  "https://dist-two-sand-84.vercel.app",
  "https://app.dritchwear.com/auth/reset-password",
  "https://app.dritchwear.com/auth/confirm-email",
  "https://app.dritchwear.com",
  "https://app.dritchwear.com/reset-password",
  "https://app.dritchwear.com/confirm-email",
  "https://dritchwear.com/reset-password",
  "https://dritchwear.com/confirm-email"
]

[auth.rate_limit]
token_refresh = 1500

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
enable_confirmations = true
max_frequency = "1m0s"
otp_length = 8

[auth.email.template.confirmation]
subject = "Confirm your Dritchwear account"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your Dritchwear password"
content_path = "./supabase/templates/recovery.html"
